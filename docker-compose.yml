services:
  db:
    image: postgres:16-alpine
    container_name: mentor-echo-postgres
    environment:
      POSTGRES_USER: mentor_echo
      POSTGRES_PASSWORD: mentor_echo
      POSTGRES_DB: mentor_echo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor_echo -d mentor_echo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mentor_echo_pgdata:/var/lib/postgresql/data

volumes:
  mentor_echo_pgdata:
